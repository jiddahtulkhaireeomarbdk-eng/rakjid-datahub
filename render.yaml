services:
  - type: web
    name: rakjid-datahub-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATAHUB_DATABASE_PATH
        value: /var/data/datahub.sqlite3
      - key: SME_API_BASE_URL
        sync: false
      - key: SME_API_KEY
        sync: false
    disk:
      name: datahub-storage
      mountPath: /var/data
      sizeGB: 1
